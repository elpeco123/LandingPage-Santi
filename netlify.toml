# Sitio estático: no hay build, Netlify publica la raíz tal cual.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    # Tiene que mandar el origen: YouTube valida el referrer del embed.
    # Con "no-referrer" el reproductor devuelve el error 153.
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
